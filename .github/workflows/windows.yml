name: Build native Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Portable core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test music, authentication, and lyrics logic
        run: dotnet test tests/Danvu.Core.Tests/Danvu.Core.Tests.csproj --configuration Release --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: TestResults/*.trx
          if-no-files-found: warn

  windows:
    name: Native Windows x64 distribution
    needs: core-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish native self-contained application
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release
      - name: Upload Windows distribution
        if: vars.MUSIC_RELEASES_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Music-Windows-x64
          path: artifacts/Music-win-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Windows download
    if: vars.MUSIC_RELEASES_ENABLED == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.created
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download this run's Windows distribution
        uses: actions/download-artifact@v4
        with:
          name: Music-Windows-x64
          path: release
      - name: Generate ZIP checksum
        working-directory: release
        run: |
          sha256sum Music-win-x64.zip > Music-win-x64.zip.sha256
          cat Music-win-x64.zip.sha256
      - name: Publish tagged Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          title="Music ${RELEASE_TAG#v} — Windows preview"
          release_args=(
            release create "$RELEASE_TAG"
            release/Music-win-x64.zip
            release/Music-win-x64.zip.sha256
            --repo "$GITHUB_REPOSITORY"
            --target "$RELEASE_SHA"
            --verify-tag
            --prerelease
            --title "$title"
            --notes-file docs/RELEASES.md
          )
          gh "${release_args[@]}"
